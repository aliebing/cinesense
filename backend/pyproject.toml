[project]
name = "cinesenseai"
version = "0.1.0"
description = "CineSense: mood-based movie discovery with an AI agent"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "langgraph==1.2.18",
    "numpy==2.5.4",
    "pgvector==0.5.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cinesense"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not db'"
markers = ["db: needs the Supabase catalogue (run with: uv run pytest -m db)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
