# `make up` (starts the local Supabase from database/supabase/, then this), then open http://localhost:8080
# Needs a .env with the Supabase / OpenRouter / Streaming Availability keys (see .env.example). The catalogue is the
# project's own Supabase (database/supabase/, started by `make up`) or a cloud Supabase, so there is no database container here.
services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway" # a local Supabase on the host (see backend/entrypoint.sh)
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "" # same origin: the browser calls /api on :8080
    environment: # only the login that guards /tech (frontend/proxy.ts), no API keys
      TECH_USER: ${TECH_USER:-}
      TECH_PASSWORD: ${TECH_PASSWORD:-}
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
