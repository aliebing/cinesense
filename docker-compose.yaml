# `docker compose up --build`, then open http://localhost:8080
# Needs a .env with the Supabase / OpenRouter / Streaming Availability keys (see .env.example). The catalogue is the
# existing Supabase (local on the host or in the cloud), so there is no database container here.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway" # a local Supabase on the host (see docker/api-entrypoint.sh)
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "" # same origin: the browser calls /api on :8080
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
